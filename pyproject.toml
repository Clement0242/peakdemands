[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "peakdemands"
version = "0.1.0"
description = "Bursts, most demanding scenarios and GPS 3.0 exposure metrics from tracking data (GPS, LPS, optical), with a designed PDF report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clément Verdier" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["sport science", "football", "GPS", "tracking", "peak demands", "worst-case scenario", "MDS"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
report = ["matplotlib>=3.7", "jinja2>=3.1", "weasyprint>=60"]
test = ["pytest>=7", "matplotlib>=3.7", "jinja2>=3.1", "weasyprint>=60"]

[project.urls]
Homepage = "https://github.com/Clement0242/peakdemands"

[tool.hatch.build.targets.wheel]
packages = ["src/peakdemands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
